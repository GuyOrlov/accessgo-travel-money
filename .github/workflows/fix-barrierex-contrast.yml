name: Fix BarrierEx colour contrast

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-barrierex-contrast.yml

permissions:
  contents: write

jobs:
  fix-contrast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Fix shared colour rules
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path("styles.css")
          css = css_path.read_text(encoding="utf-8")

          old = '.section-heading > p:last-child { margin: 1.15rem 0 0; color: var(--muted); font-size: 1.125rem; }'
          new = '''.inclusion-section .section-heading > p:last-child,
          .how-section .section-heading > p:last-child { margin: 1.15rem 0 0; color: var(--muted); font-size: 1.125rem; }'''
          if old not in css:
              raise SystemExit("Expected section-heading rule was not found")
          css = css.replace(old, new, 1)

          old_values = '.values-section .eyebrow { color: white; }'
          new_values = '''.values-section .eyebrow { color: var(--yellow); }
          .values-section .section-heading h2,
          .values-section .section-heading > p:not(.eyebrow) { color: #ffffff; }'''
          if old_values not in css:
              raise SystemExit("Expected values-section eyebrow rule was not found")
          css = css.replace(old_values, new_values, 1)

          css_path.write_text(css, encoding="utf-8")

          # Force browsers to fetch the corrected shared stylesheet on every HTML page.
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              updated = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260911-contrast', text)
              if updated != text:
                  page.write_text(updated, encoding='utf-8')

          # Self-remove this one-off maintenance workflow after the fix is committed.
          Path('.github/workflows/fix-barrierex-contrast.yml').unlink()

      - name: Commit corrected site-wide contrast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve BarrierEx site-wide colour contrast"
          git push
